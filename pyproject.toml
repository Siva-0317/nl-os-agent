[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nlagent"
version = "0.1.0"
description = "Safety-verified AI-native OS shell agent with low-latency prefix cache"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "PySide6>=6.5.0",
]

[project.scripts]
nlctl = "nlagent.cli.main:main"
nlagent = "nlagent.cli.main:main"
nlagent-gui = "nlagent.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = [
    "src",
    "scripts"
]
